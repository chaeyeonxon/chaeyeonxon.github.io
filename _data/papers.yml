- title: Perfectly Still
  subtitle: Stability and Policy Response Capacity
  slug: perfectly-still
  year: 2026
  question: How does policy history change the response capacity available to future interventions?
  plain_summary: A system can look stable today while its ability to respond to tomorrow’s intervention still depends on the policies it experienced before.
  technical_summary: Policy response capacity is a finite-horizon derivative or contrast, and identical baselines can support different response ranks. In the applications, prior notification history changes a current app-use response by 1.75 percentage points, while randomized app limits change a bonus response by 11.4 minutes per day.
  paper_url: /papers/perfectly-still/perfectly-still.pdf
  appendix_url: /papers/perfectly-still/perfectly-still-appendix.pdf
  code_url: ''
  pinned: false
  mix:
    econometrics: 40
    structural: 20
    micro: 40
    macro: 0
    measurement: 0
    institutions_policy: 0
  publication_date: '2026'
  display_date: August 2026
  abstract: >-
    Policy responses depend on the units, histories, contracts, and configurations through which an intervention changes behavior. I define policy response capacity as a finite-horizon policy-to-target derivative for continuous instruments and as a finite contrast for discrete interventions. Systems sharing a stable baseline law can have response ranks from zero to full row rank, and attraction to a zero-response state supplies a time bound for entering any stated capacity region. In 186,893 active-phase decision points from the myBPmyLife micro-randomized trial, moving assigned notification history from its 10th to its 90th percentile over 14 days reduces the current diet-notification response by 1.75 percentage points. Across four exploratory engagement targets and two notification types, the standardized response-change operators at seven and 14 days have leading singular values 0.142 and 0.136; simultaneous five-window lower endpoints are 0.023 and 0.017. The 14-day lower-rank-uniform tests reject rank zero and retain rank at most one. A separate 1,933-person factorial experiment shows that randomized app limits change the use response to a temporary bonus during its payment window. These history and configuration effects enter response transitions and a planner's finite assigned actions.
