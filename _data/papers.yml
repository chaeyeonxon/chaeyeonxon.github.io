  abstract: >-
    National accounts record where economic activity takes place, while corporate control governs which activities adjust together. The question is which information a supplied macroeconomic state preserves for a declared policy response. Variation along the state directions omitted from that representation gives the minimum dimension of a local repair. Manifold-width geometry then measures the approximation cost of retaining fewer coordinates, with curvature bounds that extend the calculation to finite policy experiments. In euro-area manufacturing, ECB monetary responses vary across lagged corporate-control indices. The fitted sign pair appears in the policy-release window when release and conference shocks enter jointly and remains under an extended rate basis and conditioning on yield-curve, sovereign-spread, and pre-announcement-news components. For an admissible monetary decomposition and a quarter-unit index radius, omitting both measured corporate coordinates gives a fitted worst-case employment error of 0.1125 log percentage points across four horizons, with a simultaneous 95 percent interval of [0.0312, 0.1939]. Retaining one coordinate lowers the point error to 0.0165. At a benchmark of one million workers, these errors correspond to 1,125 and 165 local employment equivalents. The frontier varies with the outcome family, state metric, and policy scale. The empirical exercise concerns heterogeneity in monetary responses across measured corporate states.
