- title: Subject to Availability
  subtitle: Option Production under Complementary Inputs
  slug: subject-to-availability
  year: 2026
  question: When policy options require complementary inputs, which packages actually create new actionable options and how much does each input contribute?
  plain_summary: A policy option often appears only when several complementary inputs are available together, so evaluating inputs one at a time can miss what the package actually creates.
  technical_summary: Minimal enabling input paths represent options, Möbius coefficients and linear programs recover or bound package-specific option mass, and a dual prices supplied inputs. In the childcare and work applications, the expanded timing package raises model-assisted job-compatibility mass from 0.83% to 23.74%, with 93.1% of repaired mass requiring at least two timing blocks.
