- title: The Polar Express
  subtitle: Dynamic Aggregation under Policy Holonomy
  slug: the-polar-express
  year: 2026
  question: When does a low-dimensional organizational report remain sufficient for future responses after feasible policy cycles?
  plain_summary: A dashboard can return to exactly the same numbers after a policy cycle even though the organization underneath it has changed in ways that matter for the next shock.
  technical_summary: Policy holonomy links closed report paths to latent state motion, while direction-reversed and mirrored loops identify target curvature and the additive state needed for dynamic aggregation. In LaDe data, six internal-state moments reduce next-day backlog RMSE by 6.13% beyond report history and accepted flow.
