  question: What retained information is sufficient to revalue the same economic object across new environments?
  plain_summary: To value the same object in a new environment, you do not need every old valuation; you need the right records.
  technical_summary: The rank and spectrum of a residual valuation map characterize the minimum target-directed record set. In F-MAP, four selected records cut held-out MSE by 71.7%, and two composition records recover 57,600 held-out valuations to numerical precision.
