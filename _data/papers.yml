  abstract: >-
    Institutions adapt installed reporting systems to current priorities and leave the resulting records to later users. The model combines operating and adjustment costs, rank-one reports, and policy loss from inherited precision. Under a fixed priority, reporting directions specialize geometrically. Precision orthogonal to the limiting direction remains finite, and a planner who values later use chooses slower specialization. State persistence governs how inherited precision depreciates. The archive also changes subsequent measurement: directional precision can rotate later reports, jointly chosen reports can straddle the operating priority, and report content updates beliefs about coefficients and future target regimes. The empirical application uses U.S. Call Reports. A sequential acquisition score ranks intermediate reports from prior-year information before their contents are observed. At a 25 percent report budget, the score reduces the equal-weight squared forecast loss across ridge, persistence, and gradient boosting by 25.05 percent, compared with 10.86 percent under uniform allocation. Its gains over uniform allocation have positive simultaneous lower endpoints across 10, 25, and 50 percent budgets and remain positive after deleting each target quarter. Innovation scale yields comparable allocations, delimiting the incremental role of the richer archive state.
