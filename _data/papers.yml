- title: Too Big to Aggregate
  subtitle: Corporate Control and Policy-Invariant Aggregation
  slug: too-big-to-aggregate
  year: 2026
  question: Which features of corporate control must a macro state retain to preserve a declared policy response?
  plain_summary: Two economies can look identical in national aggregates yet react differently to monetary policy when corporate control is organized differently.
  technical_summary: The rank and singular spectrum of the hidden-response operator characterize the minimum corporate-control information needed to preserve a chosen policy response. In the calibrated exercise, retaining one corporate coordinate cuts fitted worst-case employment-response error from 0.1125 to 0.0165 log percentage points.
