- title: Almost a Policy
  subtitle: Transmission through Administrative Handoffs
  slug: almost-a-policy
  year: 2026
  question: When a policy passes through administrative handoffs, which information must survive or be acquired for a downstream counterfactual to remain identified and precise?
  plain_summary: A policy can survive one administrative handoff intact and lose another counterfactual at the very same handoff.
  technical_summary: Each handoff is represented as a Markov transformation plus conditional information, which yields target-specific loss and acquisition ranks. In the Oregon Medicaid lottery, the loss rank ranges from 0 to 4 across targets, while a fixed-decision release reads 40–49% of invitation records in expectation.
  paper_url: /papers/almost-a-policy/almost-a-policy.pdf
  appendix_url: /papers/almost-a-policy/almost-a-policy-appendix.pdf
  code_url: ''
  pinned: false
  mix:
    econometrics: 45
