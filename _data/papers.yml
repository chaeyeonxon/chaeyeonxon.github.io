  publication_date: '2026'
  display_date: August 2026
  abstract: >-
    A policy reaches a recipient through administrative handoffs that transmit and measure an intervention. Each handoff is represented as a Markov transformation of an upstream experiment followed by information produced at the receiving stage. For a vector counterfactual, loss and acquisition ranks form a stage ledger. The loss rank equals the minimum score rank of an upstream channel that restores local identification. Restoring full-information precision requires rank L^(1/2)(I+L)^(-1)C′, and a semidefinite program allocates retained information between the identification and precision thresholds. A fixed-grid conditional rate attains the adjudication experiment in the local limit. A fixed-decision release separates adjudication from application in finite samples and measures cost by the number of records read. The application follows Oregon Medicaid lottery invitations through receipt, submission, eligibility decisions, and enrollment. A four-outcome lottery-assignment response vector gives a 24.7 percentage-point effect on documented receipt and a 25.6 point effect on enrollment; household-score simultaneous 95 percent intervals are 24.0–25.5 and 24.7–26.4. The reporting handoff has loss rank zero for the lottery effect on enrollment, one for population approval following an invitation, and four for approval probabilities across four reception groups; the confidence set for the last rank is {4}. The rank lower bound remains four after simultaneous sampling uncertainty and one-percent stage-record contamination. With 25 percent auditable-link capacity, target allocation gives 1.04 times the full-linkage covariance bound for the four-group audit, compared with 1.83 under uniform retention, and beats uniform retention in all 40 prespecified train–evaluation rotations.
