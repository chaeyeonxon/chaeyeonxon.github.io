  abstract: >-
    The distribution of policy gains depends on how outcomes are paired across regimes. I study a shared-component model in which policy labels fix the loadings of independent interaction terms. Under local exponential integrability, the marginal laws admit this model if and only if their Möbius-transformed cumulant generating functions are admissible. The same transforms then recover the component laws and the joint law within the class, including every policy-gain distribution. A modular Bellman model gives an economic foundation, with reoptimization illustrating its scope. Moment versions give marginal variance inequalities and paired covariance equalities. The observation scheme determines which restrictions can be assessed: the sampling results cover selected paired and state-adjusted covariance moments. A component-covariance bound and analytical examples connect departures from orthogonality to gain dispersion. Simulations examine the calibration of the paired tests.
