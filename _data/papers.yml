- title: Economica Obscura
  subtitle: Institutions, Archives, and Policy Learning
  slug: economica-obscura
  year: 2026
  question: How do institutions’ changing reporting priorities shape the archive and the policy learning available to future decision makers?
  plain_summary: Institutions optimize reports for today’s needs, but those choices determine what future researchers and policymakers can still learn.
  technical_summary: Reporting specialization creates an archive externality, and valuing future use slows specialization. In U.S. Call Reports, a common acquisition score reduces mortgage-composition MSE by 21.43–25.90% while matching forecast-specific report choices at least 95.58% of the time.
