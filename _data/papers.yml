  abstract: >-
    Economic responses indexed by recorded dates require event-time validation tailored to the specified decision. Let latent event time G be recorded as W = G + U, and let m denote a response indexed by W. For a finite linear action set, common adjoint bridges for pairwise payoff contrasts identify the action ordering within a clock-summary cell. For a nonnegative polynomial timing loss of even degree d, the recorded response and clock moments through d recover the scheduled-loss function. An adjacent-moment construction preserves m and clock moments through d − 1 and changes minimum scheduled loss and the policy choice over an interval of flexibility costs. With quadratic loss, mean displacement shifts the verified-origin scheduled date, and displacement variance determines the gap between recorded-origin and verified-origin scheduled loss. An application to European gas disruptions estimates a three-week network response around the June 2022 Nord Stream reduction, combines it with regulator and physical timing records, and maps the available clock information into scheduling and storage-option benchmarks.
