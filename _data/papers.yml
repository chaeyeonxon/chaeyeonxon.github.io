  year: 2026
  question: Which features of event-time validation are required for a specified decision when the economic event and its recorded date do not coincide?
  plain_summary: When an event’s true time and recorded time differ, the decision usually needs only part of the timing-error distribution, not a perfectly corrected timestamp.
