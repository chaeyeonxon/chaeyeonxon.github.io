  abstract: >-
    Revaluing the same economic object across environments requires a measurement profile. Under stable mixed object–environment kernels, the local relational coordinates have dimension equal to the mixed interaction rank, and a reference valuation supplies the remaining level information. Retained source values then define a residual target map. In a bilinear system, the rank of this map gives the minimum number of linear certificates needed for exact recovery. Its covariance spectrum gives prediction loss and the marginal value of another record. The F-MAP application treats source price environments and basket-composition certificates as alternative fields that can be retained. With four source records, the implemented greedy target-directed rule reduces held-out MSE by 71.7 percent relative to dispersed selection. One-exchange refinement raises the reduction to 77.7 percent; its fixed-policy loss effect has a simultaneous 95-percent interval of [0.0367, 0.0927]. Across 499 public-unit-value re-extractions crossed with ten held-out node perturbations, the four-record exchange rule has a 75.9-percent median reduction and a central range of [44.2, 90.1] percent. Two composition records complete the two residual dimensions and recover 57,600 held-out basket–target valuations to numerical precision. Treasury cash flows provide a second application using duration, convexity, and key-rate exposure records.
