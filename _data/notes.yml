  slug: simulation-error-dynamic-inequality-inference
  title: 'Simulation Error and Root-n Inference in Dynamic Inequality Estimation: A Comment on Bajari, Benkard, and Levin (2007)'
  year: 2026
  display_date: September 2026
  publication_date: '2026'
  target_authors: Bajari, Benkard, and Levin
  target_year: 2007
  target_title: Estimating Dynamic Models of Imperfect Competition
  target_venue: Econometrica
  target_url: https://doi.org/10.1111/j.1468-0262.2007.00796.x
  abstract: >-
    Bajari, Benkard, and Levin (2007) derive a root-n distribution for a simulated minimum-distance estimator based on equilibrium inequalities. Their published growth condition permits the number of sampled inequalities to increase too slowly to remove centered forward-simulation error. A bounded one-player dynamic model satisfies S1 and every displayed part of S2. Along n = m^4, n_I = m, and n_s = m^3, its simulation score contributes an N(0,2) term while the published covariance is zero. This Comment derives a replacement limit indexed by κ = lim n/(n_I n_s). The published covariance applies at κ = 0; finite positive κ adds simulation covariance; divergent κ changes the convergence rate. Binding inequalities can also generate a root-n mean shift governed by n/n_s. The stronger rates in the paper's working-paper version cover both channels. Under the stated uniformity conditions, the correction leaves the equilibrium inequalities, forward simulator, and point target unchanged.
  technical_point: The published growth condition can leave centered forward-simulation noise in the root-n limit, requiring an added simulation covariance term or stronger simulation rates.
  summary: Forward-simulation error can remain first order in root-n inference even when the published simulation-rate condition holds.
  scope_affected: The published root-n covariance formula under growth sequences where forward-simulation error remains first order, together with mean corrections at binding inequalities when simulation bias survives.
  scope_intact: Under the stated uniformity conditions, the equilibrium inequalities, forward simulator, and point target remain unchanged.
  jel_codes: C13, C15, C57, L13
  keywords:
  - dynamic games
  - simulation error
  - moment inequalities
  - minimum distance
  - asymptotic distribution
