  slug: symmetry-selection-boundary-moment-inequalities
  title: 'Symmetry and Selection in Boundary Moment Inequalities: A Comment on Pakes, Porter, Ho, and Ishii (2015)'
  year: 2026
  display_date: September 2026
  publication_date: '2026'
  target_authors: Pakes, Porter, Ho, and Ishii
  target_year: 2015
  target_title: Moment Inequalities and Their Application
  target_venue: Econometrica
  target_url: https://doi.org/10.3982/ECTA6865
  abstract: >-
    Pakes, Porter, Ho, and Ishii (2015) use symmetry of bank-specific cost shocks to construct boundary moment inequalities. The construction evaluates a sign-reversing order-statistic map at the realized number of positive choices. That count can depend on the same shocks, leaving the selected statistic's expectation unrestricted under marginal iid symmetry. A three-agent ordered-choice model satisfies the maintained choice, counterfactual, information, and symmetry conditions and yields a negative population moment at the true parameter. Joint reflection of shocks and the selected count restores finite-sample validity; a convergent selected share yields a separate large-market result. In the ATM application, the lower estimate remains 24,452 dollars; the upper estimates of 26,444 and 26,644 dollars require a repaired condition. The correction applies to the boundary sufficient-condition argument and specifications using it. The general moment inequality continues to hold when Assumptions 1–3 are imposed directly.
  technical_point: Marginal iid symmetry of bank-specific cost shocks does not by itself sign the selected boundary moment when the realized positive-choice count depends on those shocks.
  summary: A selected boundary statistic can lose the symmetry of each fixed-count statistic when the realized choice count depends on the same latent cost shocks.
  scope_affected: The boundary sufficient-condition argument and specifications using the selected-count symmetry correction without an additional joint-reflection or large-market condition.
  scope_intact: The general moment inequality continues to hold when Assumptions 1–3 are imposed directly.
  jel_codes: C12, C14, C57, L13
  keywords:
  - moment inequalities
  - partial identification
  - boundary choices
