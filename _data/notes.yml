  slug: set-valued-channel-demand-unbundling
  title: 'Set-Valued Channel Demand in Unbundling Counterfactuals: A Comment on Crawford and Yurukoglu (2012)'
  year: 2026
  display_date: September 2026
  publication_date: '2026'
  target_authors: Crawford and Yurukoglu
  target_year: 2012
  target_title: The Welfare Effects of Bundling in Multichannel Television Markets
  target_venue: American Economic Review
  target_url: https://doi.org/10.1257/aer.102.2.643
  abstract: >-
    Crawford and Yurukoglu (2012) value a channel set by optimizing viewing time. Their programs use proportional viewing and sum channel increments evaluated at one reference bundle. The printed Kuhn–Tucker allocation has corners, and the reference formula represents every selected set exactly under modularity. A two-channel economy changes purchases and surplus. The full à la carte programs also vary the household choice kernel across bargains and use different smoothing scales for demand and welfare. A replacement uses one set-value and one shock law throughout bargaining, demand, and welfare. The released tables reproduce the channel count; computing national welfare requires the fitted household and equilibrium state.
  technical_point: The released programs combine proportional viewing, fixed-reference additive channel values, and choice kernels that need not coincide with the set-valued demand object defined by the printed model.
  summary: The printed set-value problem and the distributed proportional-viewing/reference-bundle implementation need not generate the same unbundling counterfactuals.
  scope_affected: The mapping from the printed channel-allocation model into estimation and full à la carte calculations when proportional viewing, fixed-reference values, or bargain-specific choice laws are used interchangeably.
  scope_intact: The time-allocation preference, distributor bundle choice, affiliate-cost moment inequalities, and Nash bargaining architecture continue to apply under one coherent household set-value and shock law.
  jel_codes: D12, L13, L82
  keywords:
