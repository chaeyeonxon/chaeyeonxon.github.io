  slug: operator-domains-nonclassical-measurement-error
  title: 'Operator Domains in Nonclassical Measurement Error: A Comment on Hu and Schennach (2008)'
  year: 2026
  display_date: September 2026
  publication_date: '2026'
  target_authors: Hu and Schennach
  target_year: 2008
  target_title: Instrumental Variable Treatment of Nonclassical Measurement Error Models
  target_venue: Econometrica
  target_url: https://doi.org/10.1111/j.0012-9682.2008.00823.x
  abstract: >-
    Hu and Schennach (2008) identify a model with nonclassical measurement error through similarities of observable integral operators and latent multiplication operators. Their proof treats the similarities and spectral projections as bounded on the ambient L1 space. A wrapped Gaussian model satisfies Assumptions 1–5 while the observable similarity and displayed projections are unbounded; the density columns also lie outside the inverse operator's domain. Conjugated latent-band projections extend to a bounded spectral measure exactly under a uniform band-stability inequality. Combined with outcome separation and dense range, full band stability makes the measurement operator bounded below, which conflicts with smoothing by bounded densities on a nonatomic support. Equipping each candidate range with its transported graph norm restores the operator algebra. Reconstruction can then proceed under common-resolution or cyclic-orbit conditions. The factorization conclusion under Assumptions 1–5 remains an identification question.
  technical_point: A model satisfying Assumptions 1–5 can still produce an unbounded observable similarity, unbounded conjugated spectral projections, and density columns outside the inverse operator's domain.
  summary: The published spectral proof uses similarity, projection, and inverse-domain steps that require more operator control than the printed assumptions supply.
  scope_affected: The ambient-L1 spectral proof route when boundedness, inverse-domain membership, and candidate-independent stability conditions are not imposed.
  scope_intact: The factorization conclusion under Assumptions 1–5 remains an identification question; the operator algebra can be recovered on transported graph norms or under stronger common-resolution or cyclic-orbit conditions.
  jel_codes: C14, C26, C31
  keywords:
  - measurement error
  - spectral identification
  - integral operators
  - operator domains
  - latent variables
