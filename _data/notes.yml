  slug: residual-income-demand-new-products
  title: 'Quantifying the Benefits of New Products with Residual-Income Demand: A Comment on Petrin (2002)'
  year: 2026
  display_date: September 2026
  publication_date: '2026'
  target_authors: Petrin
  target_year: 2002
  target_title: 'Quantifying the Benefits of New Products: The Case of the Minivan'
  target_venue: Journal of Political Economy
  target_url: https://doi.org/10.1086/340779
  abstract: >-
    Petrin (2002) specifies automobile demand with logarithmic residual income, α_i log(y_i - p_j), while the author-distributed estimation and markup programs use its first-order price term, -α_g p_j/y_i. This Comment traces the two operators through choice probabilities, price derivatives, markups, and welfare. A finite economy gives different rankings, choice probabilities, and compensating variation under a common shock law. In a public reconstruction, the linear operator reproduces the reported mean income of minivan purchasers, 36.091 thousand dollars, with a value of 36.051. Replacing the operator by the printed affordable-set model and recontracting every product share gives 45.349; a matched seven-parameter profile gives 40.456. The demand-moment comparison changes direction relative to the CEX value. A Taylor bound measures the approximation error. Three implementations using a common utility, derivative, and support show which welfare calculations the available archive can reproduce.
  technical_point: The printed logarithmic residual-income utility and the distributed first-order price term can generate different rankings, choice probabilities, derivatives, markups, and welfare calculations.
  summary: The article's logarithmic residual-income demand and the author-distributed linearized implementation define different demand and welfare operators.
  scope_affected: Calculations that treat the printed residual-income demand operator and the author-distributed linearized implementation as the same demand system.
  scope_intact: The demographic micro-moment and new-product welfare framework remains usable when utility, derivatives, support, and welfare are implemented under one declared operator.
