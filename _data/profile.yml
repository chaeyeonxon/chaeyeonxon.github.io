name: Chae-Yeon Xon
role: Econometrics, Identification, and Counterfactuals
affiliation: Yonsei University, School of Economics
hero_line_1: Observed reality is only one realized path.
hero_line_2: What counterfactuals remain identified?
hero_line_3: What additional information would make them answerable?
about_heading: I study the worlds that economic data leave unobserved.
about_paragraph: We observe one realized path. My work asks which counterfactuals can still be recovered from it, what information makes them identifiable, and how models, measurements, institutions, and policy choices shape the answers we are able to give.
